<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Care for All</title>
    <link rel="stylesheet" href="css/styles.css"> 
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Care for All</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="hospitals.html">Hospitals</a>
            <a href="login.html" class="btn-primary">Log In / Sign Up</a>
        </div>
    </nav>

    <main class="login-container" style="display: flex; justify-content: center; align-items: center; height: 80vh;">
        <div class="card" style="width: 100%; max-width: 400px;">
            <h2 style="color: var(--primary); margin-bottom: 20px; text-align: center;">Welcome Back</h2>
            
            <form id="loginForm" action="api/users" method="POST">
                <div style="margin-bottom: 15px;">
                    <label for="email" style="display: block; margin-bottom: 5px;">Email</label>
                    <input type="email" id="email" name="email" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label for="password" style="display: block; margin-bottom: 5px;">Password</label>
                    <input type="password" id="password" name="password" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                
                <button type="submit" class="btn-primary" style="width: 100%; border: none; font-size: 1rem; cursor: pointer;">Log In</button>
            </form>
            <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">Don't have an account? <a href="#" style="color: var(--accent);">Sign up</a></p>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
